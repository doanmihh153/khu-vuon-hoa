<!doctype html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiệp 20/10 — xem trước</title>
<link rel="stylesheet" href="../assets/app.css">
</head>
<body class="min-h-screen bg-[#2b1426] font-body">
<div class="fixed inset-0 bg-[#fdf8f4]"></div>
<!-- ═══════════════ THIỆP CHÚC MỪNG ═══════════════ -->
        <div
            id="card-overlay"
            class="fixed inset-0 z-50 hidden items-center justify-center overflow-y-auto overscroll-contain p-3 sm:p-6"
            role="dialog"
            aria-modal="true"
            aria-labelledby="card-title"
        >
            <div
                id="card-backdrop"
                class="fixed inset-0 bg-[#fdf8f4] backdrop-blur-2xl"
            ></div>
            <div
                class="pointer-events-none fixed inset-0 bg-[radial-gradient(60%_50%_at_50%_0%,rgba(255,214,232,.55),transparent_70%),radial-gradient(50%_40%_at_90%_100%,rgba(255,236,205,.5),transparent_70%)]"
                aria-hidden="true"
            ></div>

            <div id="card-shell" class="relative z-10 my-auto w-full max-w-4xl">
                <!-- Tấm thiệp -->
                <article
                    id="card"
                    class="card-paper relative overflow-hidden rounded-[30px] bg-[linear-gradient(160deg,#fffaf6_0%,#fdf0ee_46%,#f7e2e6_100%)] shadow-[0_50px_120px_-40px_rgba(120,40,70,.45),0_2px_0_0_rgba(255,255,255,.9)_inset]"
                >
                    <!-- Hoa văn nền -->
                    <svg
                        class="pointer-events-none absolute -right-10 -top-10 h-56 w-56 text-[#e9b9cb]/45 sm:h-72 sm:w-72"
                        viewBox="0 0 100 100"
                        fill="currentColor"
                        aria-hidden="true"
                    >
                        <path
                            d="M50 12c6 0 10 6 10 13 0 5-2 9-5 12 3-3 7-5 12-5 8 0 14 7 14 15s-6 15-14 15c-5 0-9-2-12-5 3 3 5 7 5 12 0 8-7 14-15 14s-15-6-15-14c0-5 2-9 5-12-3 3-7 5-12 5-8 0-15-7-15-15s7-15 15-15c5 0 9 2 12 5-3-3-5-7-5-12 0-7 5-13 10-13z"
                        />
                    </svg>
                    <div
                        class="pointer-events-none absolute -bottom-24 -left-20 h-72 w-72 rounded-full bg-[#ffe9c9]/50 blur-3xl"
                    ></div>

                    <!-- Khung trang trí -->
                    <div
                        class="card-frame pointer-events-none absolute inset-x-3 rounded-[22px] border border-[#d99cb4]/35"
                        aria-hidden="true"
                    ></div>
                    <div
                        class="card-frame pointer-events-none absolute inset-x-[18px] rounded-[16px] border border-[#e2b98a]/35"
                        aria-hidden="true"
                    ></div>

                    <div
                        id="card-petal"
                        class="pointer-events-none absolute left-1/2 top-0 z-20 -translate-x-1/2 text-3xl drop-shadow-sm"
                        aria-hidden="true"
                    >
                        🌸
                    </div>

                    <div class="relative p-6 sm:p-9 md:p-11">
                        <div class="flex items-start justify-between gap-4">
                            <p
                                class="text-[11px] uppercase tracking-[0.4em] text-[#b07b95]"
                            >
                                Thiệp chúc mừng · 20/10
                            </p>
                            <button
                                id="card-close"
                                class="-mt-1 grid h-10 w-10 shrink-0 place-items-center rounded-full bg-[#8a4a68]/10 text-[#7a3b57] transition hover:bg-[#8a4a68]/20 focus:outline-none focus-visible:ring-2 focus-visible:ring-[#7a3b57]/60"
                                aria-label="Đóng thiệp"
                            >
                                <i data-lucide="x" class="h-5 w-5"></i>
                            </button>
                        </div>

                        <h2
                            id="card-title"
                            class="mt-6 max-w-[16ch] font-display text-[26px] leading-[1.22] tracking-[0.01em] text-[#5b1f3f] sm:text-[32px] md:text-[38px]"
                        >
                            GỬI BẠN YÊU CỦA TÔI 💌
                        </h2>

                        <div
                            class="mt-5 flex items-center gap-3 text-[#d9a3ba]"
                            aria-hidden="true"
                        >
                            <span class="h-px w-12 bg-current/50"></span>
                            <span class="text-sm">❀</span>
                            <span class="h-px w-12 bg-current/50"></span>
                        </div>

                        <div class="mt-7">
                            <!-- Nội dung -->
                            <div class="min-w-0">
                                <p
                                    id="card-body"
                                    class="whitespace-pre-line text-[16px] leading-[1.95] text-[#55323f]"
                                ></p>
                                <p
                                    id="card-sign"
                                    class="mt-7 whitespace-pre-line font-display text-xl italic text-[#8a3a60]"
                                ></p>

                                <div class="mt-7 flex flex-wrap gap-2.5">
                                    <button
                                        id="card-back"
                                        class="inline-flex min-h-[40px] items-center gap-2 rounded-full border border-[#d9a3ba]/70 bg-white/80 px-5 py-2 text-sm font-medium text-[#8d3159] transition hover:border-[#c04a78]/50 hover:bg-white focus:outline-none focus-visible:ring-2 focus-visible:ring-[#c04a78]/50"
                                    >
                                        <i
                                            data-lucide="arrow-left"
                                            class="h-4 w-4"
                                        ></i
                                        ><span>Trở về</span>
                                    </button>
                                </div>
                                <p
                                    id="card-toast"
                                    class="mt-3 min-h-[20px] text-xs text-[#8d3159]"
                                    role="status"
                                    aria-live="polite"
                                ></p>
                            </div>

                        </div>
                    </div>
                    <!-- BẢNG ẢNH KỶ NIỆM (polaroid) — dưới nội dung thư -->
                    <figure
                        id="card-photos"
                        class="pb"
                        aria-label="Những khoảnh khắc kỷ niệm"
                    >
                        <span class="pb-bg" aria-hidden="true"></span>
                        <span class="pb-card pb-c1"
                            ><img
                                src="../assets/imgs/opt/anh2.jpg"
                                alt="Khoảnh khắc kỷ niệm"
                                loading="lazy"
                                decoding="async"
                        /></span>
                        <span class="pb-card pb-c2"
                            ><img
                                src="../assets/imgs/opt/anh1.jpg"
                                alt="Khoảnh khắc kỷ niệm"
                                loading="lazy"
                                decoding="async"
                        /></span>
                        <span class="pb-card pb-c3"
                            ><img
                                src="../assets/imgs/opt/anh3.jpg"
                                alt="Khoảnh khắc kỷ niệm"
                                loading="lazy"
                                decoding="async"
                        /></span>
                        <span class="pb-blossom pb-b1" aria-hidden="true">🌺</span>
                        <span class="pb-blossom pb-b2" aria-hidden="true">🌸</span>
                    </figure>

                </article>
            </div>
        </div>

        
<script type="module">
import { CARD } from "../src/greetings.js";
document.getElementById("card-title").textContent = CARD.title;
document.getElementById("card-body").textContent = CARD.body;
const o = document.getElementById("card-overlay");
o.classList.remove("hidden"); o.classList.add("flex");
document.getElementById("card-shell").classList.add("is-open");
</script>
</body></html>
