<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<title>Xem trước — Cây đại thụ</title>
<style>html,body{margin:0;height:100%;background:#2b1426;overflow:hidden}canvas{display:block}</style>
<script type="importmap">
{ "imports": { "three": "../node_modules/three/build/three.module.js", "three/addons/": "../node_modules/three/examples/jsm/" } }
</script>
</head>
<body>
<script type="module">
import * as THREE from "three";
import { plantHeroTree, TREE_POS, TREE_CARD_POS, TREE_CARD_ROT } from "../src/garden-tree.js";
import { Noise2D } from "../src/utils/noise.js";
import { PALETTE } from "../src/config.js";

const q = new URLSearchParams(location.search);
const view = q.get("v") || "trunk";
const dist = Number(q.get("d") || 1);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.06;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2b1426);
const camera = new THREE.PerspectiveCamera(46, innerWidth / innerHeight, 0.1, 460);

scene.add(new THREE.HemisphereLight(0xffe3ee, 0x4a6b4a, 0.85));
const sun = new THREE.DirectionalLight(PALETTE.sun, 2.1);
sun.position.set(18, 26, 14);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, far: 120 });
sun.shadow.bias = -0.0006;
scene.add(sun);
const fill = new THREE.DirectionalLight(0xffc4d8, 0.55); fill.position.set(-14, 10, 18); scene.add(fill);
const rim = new THREE.DirectionalLight(0xfff0cf, 0.5); rim.position.set(-6, 8, -24); scene.add(rim);

const noise = new Noise2D(20251020);
const groundY = (x, z) => {
    const n = noise.fbm(x * 0.08 + 7.3, z * 0.08 + 2.1, 4);
    let y = n * 1.1;
    const pathMask = 1 - Math.min(1, Math.max(0, (Math.abs(x) - 1.175) / 2.2));
    y *= 1 - pathMask * 0.92;
    y += noise.fbm(x * 0.02, z * 0.02, 2) * 1.6 * Math.min(1, Math.abs(z) / 40);
    return y;
};

const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(160, 160, 80, 80),
    new THREE.MeshStandardMaterial({ color: 0x4d7a45, roughness: 0.95 }),
);
ground.rotation.x = -Math.PI / 2;
ground.position.set(TREE_POS.x, groundY(TREE_POS.x, TREE_POS.z), TREE_POS.z);
ground.receiveShadow = true;
scene.add(ground);

const tree = plantHeroTree({ scene, groundY, quality: { shadows: true }, cardNode: null });
tree.setReveal(1);

const base = new THREE.Vector3(TREE_POS.x, groundY(TREE_POS.x, TREE_POS.z), TREE_POS.z);
const card = new THREE.Vector3(TREE_CARD_POS.x, TREE_CARD_POS.y, TREE_CARD_POS.z).applyAxisAngle(new THREE.Vector3(0,1,0), TREE_CARD_ROT).add(base);

const views = {
    than: { pos: [card.x + 5.5, card.y + 2.4, card.z + 6.0], tgt: [card.x, card.y - 0.6, card.z] },
    bao:  { pos: [card.x + 2.9, card.y + 1.0, card.z + 3.1], tgt: [card.x, card.y, card.z] },
    day:  { pos: [base.x + 14, base.y + 8, base.z + 18], tgt: [base.x, base.y + 7, base.z] },
};
const v = views[view] || views.than;
camera.position.set(...v.pos);
camera.lookAt(...v.tgt);
if (q.get("d")) camera.position.lerp(new THREE.Vector3(...v.tgt), 1 - 1 / Number(q.get("d")));

let t = 0;
const clock = new THREE.Clock();
function frame() {
    requestAnimationFrame(frame);
    t = clock.getElapsedTime();
    tree.update(0.016, t);
    renderer.render(scene, camera);
}
frame();
window.__ready = true;
</script>
</body>
</html>
